server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA routing: /callback is a client-side route, not a file on disk.
    # Without this, the OIDC redirect leg 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or users
    # keep running the previous deploy after an upgrade.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # TLS and the security headers are terminated at Caddy; duplicating them
    # here would risk the two disagreeing.
}
