server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # THE SITE ROOT IS THE PUBLIC LANDING PAGE, not the application.
    #
    # `=` makes this the exact path "/" and nothing else, so it can never swallow
    # an application route. The application's own home is /home (src/routes.ts);
    # every other route, /callback included, is unchanged and still falls through
    # to the SPA below. That is the whole reason the application was not moved
    # under a prefix: /callback is the OIDC redirect URI registered with Keycloak,
    # and a prefix would have moved it.
    #
    # Never cached: it is the first thing every visitor loads and it links to the
    # hashed assets of the current build.
    location = / {
        try_files /landing.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # One canonical address for the landing page. (try_files above serves the file
    # in place, without a second location match, so this does not loop.)
    #
    # Relative on purpose. nginx sits behind Caddy and sees plain http, so its
    # default absolute redirect would send the browser to http://host/ and make it
    # bounce back through Caddy's http-to-https redirect to arrive where it started.
    location = /landing.html {
        absolute_redirect off;
        return 301 /;
    }

    # The logos and favicons. Not hashed, so not immutable like /assets/ -- a day
    # is long enough to matter and short enough that a corrected logo reaches
    # people the same week.
    location /landing/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA routing: /callback is a client-side route, not a file on disk.
    # Without this, the OIDC redirect leg 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or users
    # keep running the previous deploy after an upgrade.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # TLS and the security headers are terminated at Caddy; duplicating them
    # here would risk the two disagreeing.
}
